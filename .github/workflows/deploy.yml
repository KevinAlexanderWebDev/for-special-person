name: Deploy to GitHub Pages

on: 
  push: 
    branches: [master]
  pull_request:
  ` branches: [master]

jobs: 
  build-and-deploy:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - user: actions/setup-node@v4
        with: 
        node-version: '20'
        cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with: 
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: https://github.com/KevinAlexanderWebDev